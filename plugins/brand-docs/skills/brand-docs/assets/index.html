<title>Brand AI Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: fixed left rail (search + nav), single reading column on the right; rail becomes a top menu on phones. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --fg: #26262a;
  --muted: #5d5d66;
  --line: #dcdce0;
  --accent: #35566e;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecf0;
  --code-bg: #ebebed;
  --warn: #7a5a14;
  --warn-soft: #f1ead9;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 17px/1.7 var(--font-body); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--font-mono); font-size: .9em; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; text-wrap: balance; margin: 0; }

.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 24px 16px 24px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.brand { font-family: var(--font-ui); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; }
.brand small { display: block; font: 500 .72rem var(--font-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.search { font-family: var(--font-ui); width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: .95rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h4 { margin: 14px 0 4px; font: 600 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav a { font-family: var(--font-ui); display: block; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: .95rem; }
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .none { padding: 6px 10px; color: var(--muted); font-size: .9rem; }
.menu-btn { display: none; }

main { padding: 40px max(24px, env(safe-area-inset-right, 0px)) 80px 48px; }
.page { max-width: 760px; display: flex; flex-direction: column; gap: 28px; }
.page > header { display: flex; flex-direction: column; gap: 10px; }
.page h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -.02em; }
.lede { font-size: 1.12rem; color: var(--muted); margin: 0; max-width: 62ch; }
.page h2 { font-size: 1.35rem; letter-spacing: -.01em; }
.page section { display: flex; flex-direction: column; gap: 12px; }
.page p { margin: 0; max-width: 68ch; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { font: 500 .75rem var(--font-mono); padding: 3px 9px; border-radius: 99px; background: var(--code-bg); color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

.cmd { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); min-width: 0; }
.cmd code { flex: 1; min-width: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.cmd button { border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--accent); font: 600 .8rem var(--font-ui); padding: 0 14px; cursor: pointer; border-radius: 0 8px 8px 0; }
.cmd button:hover { background: var(--accent-soft); }

.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.steps > li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 .85rem var(--font-mono); margin-top: 1px; }
.steps .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.steps strong { font-weight: 600; }

.list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.prompts { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.prompts li { font-family: var(--font-ui); padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .92rem; }
.note { padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); max-width: 68ch; }
.note.warn { background: var(--warn-soft); }

.groups { display: flex; flex-direction: column; gap: 32px; }
.group > p { color: var(--muted); margin: 4px 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); text-decoration: none; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card b { font-family: var(--font-display); font-size: 1.05rem; }
.card span { color: var(--muted); font-size: .92rem; }
.card .badges { margin-top: auto; padding-top: 6px; }

.subskills { display: flex; flex-direction: column; gap: 10px; }
.sub { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.sub h3 { font: 600 1rem var(--font-mono); }
.sub p { color: var(--muted); }

.video { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; background: var(--surface); }
.video.has { border-style: solid; }
.video p { margin: 0; }
.btn { font-family: var(--font-ui); display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chain a { padding: 5px 11px; border-radius: 99px; background: var(--accent-soft); text-decoration: none; font: 500 .85rem var(--font-mono); }
.chain i { color: var(--muted); font-style: normal; }
table { font-family: var(--font-ui); border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 .72rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tablewrap { overflow-x: auto; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); max-width: 68ch; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin-top: 8px; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; }
  .menu-btn { display: inline-block; align-self: flex-start; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: 600 .9rem var(--font-ui); cursor: pointer; }
  .rail:not(.open) .search, .rail:not(.open) .nav { display: none; }
  main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">Brand AI<small>Skills documentation</small></div>
    <button class="menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="rail">Menu</button>
    <input class="search" id="q" type="search" placeholder="Search skills" aria-label="Search skills">
    <nav class="nav" id="nav" aria-label="Documentation"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
const D = {"marketplace": "nylaapp/brand-ai", "groups": [{"id": "foundation", "title": "Brand foundation", "blurb": "Run these first. Every other skill reads what they write."}, {"id": "content", "title": "Blog and content", "blurb": "Write, rewrite, check and measure blog posts."}, {"id": "pages", "title": "Pages and theme", "blurb": "Audit pages, change them, and keep the theme accessible."}, {"id": "analytics", "title": "Analytics", "blurb": "Audit, fix and protect tracking."}, {"id": "research", "title": "Customer research", "blurb": "Learn from what customers already say."}], "plugins": [{"name": "brand-capture", "group": "foundation", "tagline": "One-time brand setup. Scans a site and writes the brand files every other skill reads.", "what": "Builds BRAND.md once, when a client is set up, so no skill has to ask about the brand again. It scans the public website (about and story pages, products and prices, colors, fonts, blog style, social links, disclaimers) and reads any brand book you give it. It asks four short questions a website can't answer, then writes the brand files.", "prompts": ["Capture the brand for example.com", "Set up the brand file", "Create BRAND.md", "Onboard a new client"], "steps": ["It asks whether the brand has an existing store or website and a brand book, and which draft theme should hold the brand files.", "It scans the website and reads the brand book if you provided one.", "It asks four questions in one message: top 3 competitors, inspiration brands, who approves things, and anything the brand must never say or claim.", "It studies each inspiration brand and records in BRAND.md what the brand can learn from it.", "It writes the files and asks at most four follow-up questions for anything the scan could not settle."], "produces": ["BRAND.md (brand identity, the source of truth)", "BRAND-VOICE.md (how the brand sounds)", "design.md (palette, type, spacing, corners, components, imagery)", "BRAND.html (a readable copy for the client)", "BRAND-QUESTIONS.md (open follow-up questions)"], "requires": ["Nothing. Start here."], "guardrails": ["Scans public pages only.", "Optional shared copy of the non-confidential files for the team."], "next": ["competitor-research", "styles-builder", "blog-generator"], "version": "0.5.0", "install": "/plugin install brand-capture@brand-ai", "listing": "One-time brand setup: scans a site, reads any brand book, and writes BRAND.md, BRAND-VOICE.md and BRAND-QUESTIONS.md in a draft theme's folder, where every other skill reads them."}, {"name": "competitor-research", "group": "foundation", "tagline": "Dated research on the top 3 competitors named in BRAND.md.", "what": "Turns the client's top 3 competitors into COMPETITORS.md. Inspiration brands are not covered here; brand-capture asks for and studies them. For each competitor it compares where they operate against the client, what they sell and at what price, pricing model (flat, packages, memberships, subscriptions), offers and referral programs, how often they publish and who writes it, and how they position themselves. It ends with concrete openings for the client.", "prompts": ["Research the competitors", "Competitor analysis", "Build COMPETITORS.md", "Refresh the competitor research"], "steps": ["It takes the top 3 competitors from BRAND.md. If none are listed, it asks you for your top 3.", "It researches each competitor and compares it with the client.", "It writes COMPETITORS.md next to BRAND.md and lists openings for the client."], "produces": ["COMPETITORS.md (dated, re-run every few months)"], "requires": ["brand-capture (BRAND.md)"], "guardrails": ["Never changes BRAND.md."], "next": ["blog-generator"], "version": "0.3.0", "install": "/plugin install competitor-research@brand-ai", "listing": "Deep, dated research on a client's named competitors, written to COMPETITORS.md in the draft theme's folder."}, {"name": "styles-builder", "group": "foundation", "tagline": "Turn a brand book or reference store into design tokens and apply them to the theme.", "what": "Creates or deepens design.md (typography, color schemes, spacing, corner radius, shadows, buttons, component states) and applies those tokens into the theme's settings_schema.json and settings_data.json. It also sets up what a new theme needs before pages get built: logo and favicon, motion, input fields, and variant pickers and swatches. Optionally it brands the starter section templates.", "prompts": ["Generate design tokens", "Create design.md", "Set up the brand's colors and fonts in the theme", "Match the reference store's look", "Get the theme ready to build on"], "steps": ["If BRAND.md or design.md are missing, it runs brand-capture first and waits for it to finish.", "It builds the full token set from your brand book or a reference store.", "It applies the tokens into the theme settings and sets up the starter essentials.", "If you opted in at the start, it brands the starter section templates."], "produces": ["design.md", "Updated settings_schema.json and settings_data.json", "Logo, favicon, motion, input and variant picker setup"], "requires": ["brand-capture"], "guardrails": ["Starter section styling only happens if you opt in when it starts."], "next": ["page-studio"], "version": "0.6.2", "install": "/plugin install styles-builder@brand-ai", "listing": "Generate design.md from a brand book or reference store, apply it and the starter setup (logo, favicon, motion, inputs, variant pickers) into the theme's settings, and optionally brand the starter section templates."}, {"name": "blog-generator", "group": "content", "tagline": "Research and write SEO and AEO blog posts, delivered as hidden Shopify drafts.", "what": "Writes blog posts meant to be found in Google and cited by AI answer engines. It asks intent, media, delivery, mode and topic once, reads BRAND.md and COMPETITORS.md instead of re-asking about the brand, researches what changes each time, and shows the outline for approval before writing.", "prompts": ["Write a post for my store", "Write a buying guide for X", "Make a how-to article about X", "I need a blog post for better SEO"], "steps": ["It checks what it needs first (web search, your brand files, Shopify connected for a hidden draft) and walks you through setting up anything missing, in plain steps.", "Answer the setup questions once: intent, media, delivery, mode, topic.", "It researches the topic and shows the outline in chat.", "You approve the outline.", "It delivers a hidden Shopify draft, or paste-ready HTML, with SEO fields, images, schema and internal links."], "produces": ["A hidden Shopify draft (via connector or browser), or paste-ready HTML", "SEO fields, images, schema, internal links"], "requires": ["brand-capture (BRAND.md). competitor-research is optional but used when present.", "Web search in Claude. Recommended: Shopify connected (connector or a signed-in browser) for a hidden draft instead of HTML, Python 3 for the QA check, and fact-check installed.", "No need to set these up in advance: it checks them first and walks you through anything missing, step by step."], "guardrails": ["Posts land as hidden drafts for a human to review.", "Guided mode or fully automated mode. Also runs from blog-autopilot."], "next": ["fact-check", "seo-audit"], "version": "0.3.1", "install": "/plugin install blog-generator@brand-ai", "listing": "Research and write SEO/AEO-optimized Shopify blog posts."}, {"name": "blog-rewriter", "group": "content", "tagline": "Rewrite an existing article in the store's brand voice and post it as a hidden draft.", "what": "Takes a finished article written by someone else (a URL, Google Doc, .docx, .txt or .md file, or pasted text) and rewrites it in the store's voice. It is a voice transplant: facts and claims never change, only wording, tone, rhythm and terminology. Four depths are available: Match, Reword, Restructure and Reimagine.", "prompts": ["Rewrite this doc for the blog", "Put this article in our voice", "Make this guest post on brand", "Clean this up and post it as a draft"], "steps": ["It checks what it needs first (web search, your brand files, blog-generator, Shopify connected, and Google Drive or a Word reader for those sources) and walks you through setting up anything missing, in plain steps.", "Give it the article and choose a rewrite depth.", "It rewrites in the voice from BRAND.md and the live blog, then fact-checks.", "It posts a hidden draft with SEO fields and a preview link.", "If Shopify is unavailable or not signed in, it returns paste-ready HTML and a fields sheet and says why."], "produces": ["A hidden Shopify draft with SEO fields and a preview link", "Fallback: paste-ready HTML and a fields sheet"], "requires": ["blog-generator", "brand-capture (BRAND.md)", "Web search in Claude. Recommended: Shopify connected and Python 3 (required for series and image transfer). Google Drive connected for Google Doc sources.", "No need to set these up in advance: it checks them first and walks you through anything missing, step by step."], "guardrails": ["Never quietly changes a claim. Anything changed is flagged.", "Posts are hidden drafts only."], "next": ["seo-audit"], "version": "0.9.1", "install": "/plugin install blog-rewriter@brand-ai", "listing": "Rewrite existing articles in a store's brand voice and post as hidden drafts."}, {"name": "blog-autopilot", "group": "content", "tagline": "Decides when a store should blog and what to cover, then hands off to the writer.", "what": "The editor-in-chief. It scans store events (new products, restocks, rising sellers), Search Console exports, review and helpdesk exports, competitor blog feeds, trends and an occasion calendar, scores the opportunities, and applies guardrails: dedupe, cannibalization, cooldowns and a weekly cap. It never writes the post itself.", "prompts": ["What should we blog about this week?", "Set up blogging on a schedule", "Is anything worth a new post right now?"], "steps": ["It checks what it needs first (a folder, Shopify connected, Python, Search Console and review exports) and walks you through setting up anything missing, in plain steps.", "It runs a weekly scan and scores opportunities.", "By default it checks in with you and drafts only after you say yes.", "It hands the brief to blog-generator, which writes a hidden draft.", "Optional: turn on auto-draft."], "produces": ["A ranked list of post opportunities", "A brief handed to blog-generator"], "requires": ["blog-generator", "brand-capture", "The Claude desktop app with a folder, Shopify connected, Python 3, and the computer awake with Claude open for the weekly check-in. Recommended: Search Console, review and helpdesk exports.", "No need to set these up in advance: it checks them first and walks you through anything missing, step by step."], "guardrails": ["Check-in first, draft only after approval, unless auto-draft is on.", "Each brand keeps its own profile."], "next": ["blog-generator"], "version": "0.2.1", "install": "/plugin install blog-autopilot@brand-ai", "listing": "Decide when and what to blog from store, SEO and seasonal signals."}, {"name": "fact-check", "group": "content", "tagline": "Independent fact-check for blog and marketing copy, with guardrails for regulated claims.", "what": "Pulls out every factual claim, flags the risky ones (FDA and other regulatory status, medical and treatment claims, ingredient facts, pregnancy and safety statements, clinically proven, statistics), checks them against primary sources, and returns a claim-by-claim report with verdicts, citations and safer rewrites.", "prompts": ["Fact-check this post", "Check the FDA wording in this copy", "Is this accurate?", "Check this before we publish"], "steps": ["It checks what it needs first (web search, and your brand files if you have them) and walks you through setting up anything missing, in plain steps.", "Give it pasted text, a file, a URL or a Shopify article.", "It lists each claim and marks which are risky.", "It verifies against authoritative sources.", "You get verdicts, citations and safer wording."], "produces": ["A claim-by-claim report with verdicts, citations and safer rewrites"], "requires": ["Web search in Claude. Works on its own or after blog-generator. Brand files and Python 3 recommended.", "No need to set these up in advance: it checks them first and walks you through anything missing, step by step."], "guardrails": ["It flags and verifies. It never approves.", "Regulated claims still need a qualified human or legal review."], "next": ["blog-rewriter"], "version": "0.2.1", "install": "/plugin install fact-check@brand-ai", "listing": "Fact-check blog and marketing copy with guardrails for regulated claims."}, {"name": "seo-audit", "group": "content", "tagline": "Check a blog post after it goes live, then track real Search Console rankings.", "what": "Audits the live page with Google's own tools: structured data and Rich Results, PageSpeed Insights, title, meta, H1, leftover placeholders and indexing. About two and four weeks later it follows the post's real ranking numbers from Search Console.", "prompts": ["I published the post", "Check my new blog post", "Audit the live post", "Did the post get indexed?", "How is the blog post doing in Google?"], "steps": ["It checks what it needs first (a browser, Search Console access, an optional free PageSpeed key) and walks you through setting up anything missing, in plain steps.", "Run it on publish day to check the live page.", "Run it again around week 2 and week 4 for ranking numbers.", "It can also run from a scheduled daily blog check."], "produces": ["A live-page audit and ranking follow-ups at 2 and 4 weeks"], "requires": ["A browser Claude can use, and Search Console access for the ranking checks. Recommended: Shopify connected and a free PageSpeed API key. Pairs with blog-generator.", "No need to set these up in advance: it checks them first and walks you through anything missing, step by step."], "guar const byName = Object.fromEntries(D.plugins.map(p => [p.name, p]));
const SKILL_TO_PLUGIN = {};
D.plugins.forEach(p => { (p.skills || []).forEach(s => SKILL_TO_PLUGIN[s.name] = p.name); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REPO = D.marketplace;

function cmd(text) {
  return '<div class="cmd"><code>' + esc(text) + '</code><button type="button" data-copy="' + esc(text) + '">Copy</button></div>';
}
function list(items, cls) { return '<ul class="' + (cls || 'list') + '">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>'; }
function videoFor(key, label) {
  const url = D.videos[key];
  if (url) return '<div class="video has"><p><b>' + esc(label) + '</b><br>Video tutorial</p><a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Watch video</a></div>';
  return '<div class="video"><p><b>' + esc(label) + '</b><br>Video tutorial coming soon.</p></div>';
}
function badges(p) {
  return '<div class="badges"><span class="badge">v' + esc(p.version) + '</span>' +
    (p.status ? '<span class="badge warn">' + esc(p.status) + '</span>' : '') +
    (p.skills ? '<span class="badge">' + p.skills.length + ' skills</span>' : '') + '</div>';
}
function chain(names) {
  return '<div class="chain">' + names.map((n, i) => (i ? '<i>then</i>' : '') + '<a href="#skill-' + n + '">' + esc(n) + '</a>').join('') + '</div>';
}

const pages = {};

pages.start = () => `
<div class="page">
  <header>
    <h1>Get started</h1>
    <p class="lede">Add the Brand AI marketplace in Claude Cowork, install the skills, set up one brand, and run your first skill. About ten minutes. You don't need to be technical: the skills explain each step, and walk you through anything you need to set up.</p>

      <li><div class="body"><strong>Install brand-capture.</strong> Every other skill builds on its output, so install it first. Find <b>brand-capture</b> under the Brand AI marketplace and click <b>Install</b>.</div></li>

      <li><div class="body"><strong>Capture the brand.</strong> Start a Cowork task in the client's project folder and say:${cmd('Capture the brand for example.com')}<p>It asks about the existing site and brand book, then four short questions, and writes <code>BRAND.md</code>, <code>BRAND-VOICE.md</code> and <code>design.md</code>.</p></div></li>

    </ol>
  </section>
  <section>
    <h2>Suggested order</h2>

    <ol class="list">
      <li>The project root.</li>

pages.skills = (query) => {
  const q = (query || '').toLowerCase().trim();
  const hit = p => !q || [p.name, p.tagline, p.what, (p.prompts || []).join(' '), (p.skills || []).map(s => s.name + ' ' + s.tagline).join(' ')].join(' ').toLowerCase().includes(q);
  const groups = D.groups.map(g => ({ g, items: D.plugins.filter(p => p.group === g.id && hit(p)) })).filter(x => x.items.length);
  return `<div class="page">
  <header><h1>Skills</h1><p class="lede">${D.plugins.length} plugins. Open one to see what it does, how to use it and what it produces.${q ? ' Showing results for "' + esc(query) + '".' : ''}</p></header>
  <div class="groups">${groups.length ? groups.map(({ g, items }) => `
    <div class="group"><h2>${esc(g.title)}</h2><p>${esc(g.blurb)}</p>
    <div class="cards">${items.map(p => `<a class="card" href="#skill-${p.name}"><b>${esc(p.name)}</b><span>${esc(p.tagline)}</span>${badges(p)}</a>`).join('')}</div></div>`).join('') : '<p>No skills match that search.</p>'}
  </div></div>`;
};

function skillPage(p) {
  const subs = p.skills ? `<section><h2>Skills in this plugin</h2><div class="subskills">${p.skills.map(s => `
    <div class="sub"><h3>${esc(s.name)}</h3><p>${esc(s.tagline)}</p>${list(s.prompts, 'prompts')}${videoFor(s.name, s.name)}</div>`).join('')}</div></section>` : '';
  const vids = p.skills ? '' : '<section><h2>Video tutorial</h2>' + videoFor(p.name, p.name) + '</section>';
  const next = (p.next && p.next.length) ? `<section><h2>What to run next</h2>${chain(p.next)}</section>` : '';
  return `<div class="page">
  <header>
    ${badges(p)}
    <h1>${esc(p.name)}</h1>
    <p class="lede">${esc(p.tagline)}</p>
    <p class="lede">Install it in Cowork: <b>Customize &gt; Plugins</b>, find <b>${esc(p.name)}</b> in the Brand AI marketplace and click <b>Install</b>.</p>
  </header>
  <section><h2>What it does</h2><p>${esc(p.what)}</p></section>
  ${subs}
  <section><h2>How to ask for it</h2><p>Say something like:</p>${list(p.prompts, 'prompts')}</section>
  <section><h2>How it works</h2><ol class="steps">${p.steps.map(s => '<li><div class="body">' + esc(s) + '</div></li>').join('')}</ol></section>
  <section><h2>What it produces</h2>${list(p.produces)}</section>
  <section><h2>Needs first</h2>${list(p.requires)}</section>
  <section><h2>Guardrails</h2>${list(p.guardrails)}</section>
  ${vids}
  ${next}
</div>`;
}

function renderNav(query) {
  const q = (query || '').toLowerCase().trim();
  const cur = (location.hash || '#start').slice(1);
  const link = (id, label) => '<a href="#' + id + '"' + (cur === id ? ' aria-current="page"' : '') + '>' + esc(label) + '</a>';
  let h = '<h4>Guide</h4>' + link('start', 'Get started');
  h += '<h4>Skills</h4>' + link('skills', 'All skills');
  D.groups.forEach(g => {
    const items = D.plugins.filter(p => p.group === g.id && (!q || (p.name + ' ' + p.tagline + ' ' + (p.skills || []).map(s => s.name).join(' ')).toLowerCase().includes(q)));
    if (items.length) { h += '<h4>' + esc(g.title) + '</h4>' + items.map(p => link('skill-' + p.name, p.name)).join(''); }
  });
  if (q && !D.plugins.some(p => (p.name + ' ' + p.tagline).toLowerCase().includes(q))) h += '<div class="none">No matches</div>';
  document.getElementById('nav').innerHTML = h;
}

let query = '';
function render() {
  let id = (location.hash || '#start').slice(1);
  let html;
  if (id.startsWith('skill-') && byName[id.slice(6)]) html = skillPage(byName[id.slice(6)]);
  else if (id.startsWith('skill-') && SKILL_TO_PLUGIN[id.slice(6)]) { id = 'skill-' + SKILL_TO_PLUGIN[id.slice(6)]; html = skillPage(byName[id.slice(6)]); }
  else if (id === 'skills') html = pages.skills(query);
  else if (pages[id]) html = pages[id]();
  else { id = 'start'; html = pages.start(); }
  document.getElementById('main').innerHTML = html;
  renderNav(query);
}

function go(id) {
  try { location.hash = id; } catch (e) {}
  render();
  window.scrollTo(0, 0);
  document.getElementById('rail').classList.remove('open');
  document.getElementById('menu').setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('button[data-copy]');
  if (b) {
    const text = b.getAttribute('data-copy');
    const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Press copy keys';
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  }
});
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value;
  if (query && (location.hash || '#start') !== '#skills') { try { location.hash = 'skills'; } catch (err) {} }
  render();
});
document.getElementById('menu').addEventListener('click', () => {
  const r = document.getElementById('rail'); const open = r.classList.toggle('open');
  document.getElementById('menu').setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', render);
render();
</script>
